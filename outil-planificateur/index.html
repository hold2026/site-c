<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Planificateur de plate-bande potager : nombre de plants</title><meta name="description" content="Calculez le nombre de plants selon la taille de la plate-bande et l'espacement choisi."></head><body><h1>Planificateur de plate-bande</h1><p><em>Contenu généré avec l'aide de l'IA.</em></p><p>Indiquez les dimensions de votre plate-bande et l'espacement indiqué sur votre sachet de graines ou votre étiquette de plants. Le calcul est purement géométrique.</p><form id="f"><p><label>Longueur (cm) <input id="l" type="number" min="1" value="200"></label></p><p><label>Largeur (cm) <input id="w" type="number" min="1" value="100"></label></p><p><label>Espacement entre plants (cm) <input id="e" type="number" min="1" value="30"></label></p><p><label>Espacement entre rangs (cm) <input id="r" type="number" min="1" value="40"></label></p><button type="submit">Calculer</button></form><p id="res" aria-live="polite"></p><p><a href="../index.html">Retour à l'accueil</a></p><script>document.getElementById('f').addEventListener('submit',function(x){x.preventDefault();var l=+document.getElementById('l').value,w=+document.getElementById('w').value,e=+document.getElementById('e').value,r=+document.getElementById('r').value;if(!(l>0&&w>0&&e>0&&r>0)){document.getElementById('res').textContent='Valeurs invalides.';return;}var rangs=Math.floor(w/r)+1,par=Math.floor(l/e)+1;document.getElementById('res').textContent=rangs+' rangs de '+par+' plants, soit '+(rangs*par)+' plants au total (surface : '+((l*w)/10000).toFixed(2)+' m²).';});</script><script data-goatcounter="https://hold2026.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script></body></html>
