<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Calculateur de plants par planche</title></head><body><h1>Calculateur de plants par planche</h1><p><em>Contenu IA : outil de calcul simple, sans donnée externe. Aucun lien affilié.</em></p><p>Saisissez les dimensions de votre planche et l'espacement souhaité entre les plants (indiqué sur votre sachet de graines ou votre étiquette).</p><form onsubmit="return false"><label>Longueur de la planche (cm) : <input id="l" type="number" min="1" value="200"></label><br><label>Largeur de la planche (cm) : <input id="w" type="number" min="1" value="100"></label><br><label>Espacement entre plants (cm) : <input id="e" type="number" min="1" value="30"></label><br><button id="b">Calculer</button></form><p id="r"></p><script>document.getElementById('b').addEventListener('click',function(){var l=+document.getElementById('l').value,w=+document.getElementById('w').value,e=+document.getElementById('e').value;var r=document.getElementById('r');if(!(l>0&&w>0&&e>0)){r.textContent='Veuillez saisir des valeurs positives.';return;}var a=Math.floor(l/e)+1,b=Math.floor(w/e)+1;r.textContent='Disposition en grille : '+a+' rangs x '+b+' plants = '+(a*b)+' plants (estimation, bords inclus).';});</script><p><a href="../index.html">Retour à l'accueil</a></p><script data-goatcounter="https://hold2026.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script></body></html>
