<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Calculateur d'espacement entre plants</title><meta name="description" content="Calcul simple de l'espacement à respecter entre vos plants au potager."></head><body><h1>Calculateur d'espacement entre plants</h1><p><em>Contenu généré avec l'aide de l'IA.</em></p><p>Entrez le type de légume pour connaître l'espacement minimal recommandé.</p><form><label for="legume">Légume :</label><select id="legume"><option value="">-- Sélectionnez --</option><option value="tomate">Tomate (40-50 cm)</option><option value="salade">Salade (25-30 cm)</option><option value="courge">Courge (90-120 cm)</option><option value="haricot">Haricot (15-20 cm)</option><option value="carotte">Carotte (10-15 cm)</option><option value="poivron">Poivron (40-50 cm)</option></select><br><br><label for="longueur">Longueur de la ligne (cm) :</label><input type="number" id="longueur" value="100"><br><br><button type="button" onclick="calculer()">Calculer</button></form><p id="resultat"></p><script>function calculer(){const l=document.getElementById('longueur').value;const e=document.getElementById('legume').value;const espacements={'tomate':45,'salade':27.5,'courge':105,'haricot':17.5,'carotte':12.5,'poivron':45};if(!e){alert('Sélectionnez un légume');return;}const esp=espacements[e];const nb=Math.floor(l/esp);document.getElementById('resultat').innerHTML='<strong>'+nb+' plants</strong> tous les '+esp+' cm sur '+l+' cm.';}</script><p><small><strong>Sources :</strong> espacements conventionnels issus de guides de jardinage reconnus.</small></p><script data-goatcounter="https://hold2026.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script></body></html>
