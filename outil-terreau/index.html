<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Calculateur de volume de terreau pour bac ou carré potager</title><meta name="description" content="Calculez en litres le volume de terreau nécessaire pour remplir un bac, une jardinière ou un carré potager."></head><body style="font-family:sans-serif;max-width:640px;margin:2em auto;padding:0 1em"><p><a href="../index.html">← Accueil</a></p><h1>Calculateur de volume de terreau</h1><p><em>Contenu généré par IA. Simple calcul géométrique : volume = longueur × largeur × hauteur de terre.</em></p><form onsubmit="return false"><p><label>Longueur (cm) <input id="l" type="number" min="0" value="120"></label></p><p><label>Largeur (cm) <input id="w" type="number" min="0" value="120"></label></p><p><label>Hauteur de terre (cm) <input id="h" type="number" min="0" value="25"></label></p><p><label>Nombre de bacs <input id="n" type="number" min="1" value="1"></label></p><p><label>Taille des sacs (litres) <input id="s" type="number" min="1" value="50"></label></p><button onclick="c()">Calculer</button></form><p id="r" style="font-weight:bold"></p><p>Astuce de calcul : 1 litre = 1000 cm³. Le tassement du terreau n'est pas pris en compte ; prévoyez une petite marge.</p><script>function c(){var l=+document.getElementById('l').value,w=+document.getElementById('w').value,h=+document.getElementById('h').value,n=+document.getElementById('n').value||1,s=+document.getElementById('s').value||1;var v=l*w*h*n/1000;document.getElementById('r').textContent='Volume : '+v.toFixed(1)+' litres, soit '+Math.ceil(v/s)+' sac(s) de '+s+' L.';}</script><script data-goatcounter="https://hold2026.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script></body></html>
